server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      enabled: true
      file-size-threshold: 1MB
  profiles:
    # LangFuse和可观测配置以及专业知识库配置
    include: observability, kb
  application:
    name: spring-ai-alibaba-deepresearch
  # Redis 配置
  data:
    redis:
      enabled: false
      host: localhost
      port: 6379
      password: ${REDIS-PASSWORD}
      timeout: 3000 # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  ai:
    vectorstore:
      type: simple
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com
      embedding:
        options:
          model: text-embedding-v1

    mcp:
      client:
        enabled: true
        type: ASYNC
        request-timeout: PT5M
    alibaba:
      graph:
        observation:
          enabled: false
      toolcalling:
        baidu:
          search:
            enabled: true
        tavilysearch:
          api-key: ${TAVILY_API_KEY}
          enabled: true
        jinacrawler:
          enabled: false
          api-key: ${JINA_API_KEY}
        serpapi:
          api-key: ${SERPAPI_KEY}
          enabled: true
        aliyunaisearch:
          api-key: ${ALIYUN_AI_SEARCH_API_KEY}
          base-url: ${ALIYUN_AI_SEARCH_BASE_URL}
          enabled: true
        # 学术研究工具调用配置
        openalex:
          enabled: false
        # 旅游生活工具调用配置
        opentripmap:
          enabled: false
          api-key: ${OPENTRIPMAP_API_KEY}
        # 百科知识工具调用配置
        wikipedia:
          enabled: false
        # 数据分析工具调用配置
        worldbankdata:
          enabled: false
        googlescholar:
          enabled: false
      deepresearch:
        # 图执行的最大迭代次数
        max-iterations: 50
        # 定义项目可以使用的搜索引擎
        search-list:
          - tavily
          - aliyun
          - baidu
          - serpapi
        smart-agents:
          enabled: false
          search-platform-mapping:
            academic_research:
              primary: openalex
            lifestyle_travel:
              primary: opentripmap
            encyclopedia:
              primary: wikipedia
            data_analysis:
              primary: worldbankdata
            general_research:
              primary: tavily
        http-client:
          connect-timeout-ms: 30000
          read-timeout-ms: 300000
          connection-request-timeout-ms: 30000
        mcp:
          enabled: true
          config-location: classpath:mcp-config.json
        research-mcp-extra-sources: 2
        parallel-node-count:
          researcher: 4
          coder: 4
        rag:
          enabled: false
          # 可以设置为 'simple' 或 'elasticsearch'
          vector-store-type: simple
          data:
            # 启动时加载 classpath下data目录中的所有文件
            locations:
              - "classpath:/data/"
          # Elasticsearch配置
          #elasticsearch:
          #  uris: http://localhost:9200
          #  similarity-function: cosine

        # 报告导出路径配置
        export:
          path: ${AI_DEEPRESEARCH_EXPORT_PATH}
        reflection:
          enabled: true
          max-attempts: 1
        # 短期记忆配置
        short-term-memory:
          enabled: true
          # 会话记忆配置
          conversation-memory:
            # 最长保留会话长度
            max-messages: 100
          # 用户角色记忆配置
          user-role-memory:
            # 用户角色短期记忆引导模型生成的范围
            guide-scope: every
            # 判定需要更新记忆时相似度阈值，范围0~1，默认0.8
            update-similarity-threshold : 0.8
            # 参考历史用户提问的条数
            history-user-messages-num: 10
          # 记忆类型
          memory-type: in-memory
        # 长期记忆配置 (OpenClaw Markdown方式)
        long-term-memory:
          enabled: true
          provider: mem0
          # 保存到当前项目目录下: {user.dir}/.deepresearch/workspace/memory/
          workspace-path: ${user.dir}/.deepresearch/workspace
          auto-flush: true
          mem0:
            api-key: m0-IZ7vnizP4LQ1GhjVX9HmQQ08fxt3amWEMay9Zodo
            user-id: liyongqing
            app-id: deepresearch
            top-k: 10
            infer-on-write: true
            async-mode: true
            custom-instructions: >
              Please extract and output memories strictly in Simplified Chinese.
              Must use Simplified Chinese for all extracted memories.
              Preserve Chinese names, company names, job titles, and other proper nouns exactly as written in the source conversation.
              Never transliterate Chinese names into pinyin or translate them into English.
              For identity facts such as name, occupation, company, and city, prefer the user's exact original wording.
              If the original text is Chinese, the memory must remain Chinese.
          # 记忆语义检索配置 (v2 hybrid search)
          memory-search:
            enabled: true
            max-results: 5
            # chunk-size: 1600
            # chunk-overlap: 320
            # vector-weight: 0.7
            # text-weight: 0.3
            # half-life-days: 30
            # mmr-lambda: 0.7
            # candidate-multiplier: 4
            # embedding-cache-size: 50000



logging:
  level:
    com.alibaba.cloud.ai.example.deepresearch: debug
    com.alibaba.cloud.ai.example.deepresearch.controller.graph.GraphProcess: info

